# Retain a warm surface-lighting cache while it adapts to an abrupt clock or
# weather change. Avoid a full cache clear and a cold-start sampling burst.
# The driver holds this layer briefly, then releases it to the normal profile.
rtx.spatiallyHashedRadianceCache.maxNumFramesToAccumulate = 8
rtx.spatiallyHashedRadianceCache.staleFrameNumber = 8
